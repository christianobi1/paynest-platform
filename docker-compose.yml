services:
  backend:
    build:
      context: ../zuriapp-backend
    image: zuriapp-backend:local
    container_name: zuriapp-backend
    env_file:
      - ../zuriapp-backend/.env
    ports:
      - "5000:5000"
    restart: unless-stopped
    networks:
      - zuri-network

  frontend:
    build:
      context: ../zuriapp-frontend
      args:
        VITE_API_URL: http://localhost:5000
    image: zuriapp-frontend:local
    container_name: zuriapp-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - zuri-network

networks:
  zuri-network:
    driver: bridge
